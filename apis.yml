name: Res
description: 'Res (ResQ) is an AI-powered operations platform for the service economy, connecting
  restaurants, hospitality groups, and facilities-management teams with vetted trades vendors to
  manage repair-and-maintenance work orders end to end. The platform covers work-order intake and
  dispatch, vendor sourcing and communication, invoicing and payments, and reporting across trades
  such as HVAC, plumbing, refrigeration, and electrical. Backed by Homebrew and surfaced through the
  API Evangelist network, ResQ operates a web and mobile SaaS product; it publishes no public
  developer API, OpenAPI definitions, SDKs, or webhook surface at this time, so this profile captures
  company identity, website properties, and probed domain-security posture.'
